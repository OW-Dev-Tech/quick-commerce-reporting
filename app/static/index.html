<!doctype html><html lang=en><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1">
<title>Daily Reports</title><link rel=stylesheet href=/static/style.css>
<header><div class=bar><span class=logo>📊 Daily Reports</span>
 <nav class=tabs><a class=tab id=t-home href="#/">Dashboard</a><a class=tab id=t-setup href="#/setup">Setup</a></nav>
 <span id=sync class="chip"></span></div></header>
<main id=app></main>
<aside class=drawer id=drawer></aside><div id=toast></div>

<dialog id=dBrand><form method=dialog onsubmit="return false">
 <h2 id=dBrandTitle>Add brand</h2>
 <label>Brand name</label><input id=bName placeholder="e.g. Acme Foods">
 <label>Google Sheet link for this brand's reports</label><input id=bSheet placeholder="Paste the sheet's link here">
 <p class=hint>Reports get added to this sheet automatically. Optional - you can add it later.</p>
 <div class=row style="margin-top:18px;justify-content:flex-end"><button class=btn onclick="dBrand.close()">Cancel</button><button class="btn primary" onclick="saveBrand()">Save</button></div>
</form></dialog>

<dialog id=dLogin><form method=dialog onsubmit="return false">
 <h2 id=dLoginTitle>Add login</h2>
 <label>Brand</label><select id=lBrand></select>
 <label>Platform</label><select id=lPlat onchange="platChange()"></select>
 <label>Login email</label><input id=lEmail type=email placeholder="the email used to sign in to the portal">
 <div id=pwWrap><label>Password</label><input id=lPw type=password autocomplete=new-password>
  <p class=hint>Saved only on this computer. Leave empty to keep the existing one.</p></div>
 <div id=rpWrap><label>Report name (or just part of it)</label><input id=lReport placeholder="e.g. gamma">
  <p class=hint>Type a few letters of the report's name, like you would in the portal. We pick the first match.</p></div>
 <label id=adsWrap style="font-weight:500;display:none;gap:8px;align-items:center;margin-top:14px"><input type=checkbox id=lAds style="width:auto"> Also download the Ads "Performance Summary" report</label>
 <label>Notes (optional)</label><input id=lNotes placeholder="e.g. owned by Priya">
 <div class=row style="margin-top:18px;justify-content:flex-end"><button class=btn onclick="dLogin.close()">Cancel</button><button class="btn primary" onclick="saveLogin()">Save</button></div>
</form></dialog>

<script>
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const api=async(u,m='GET',b)=>{const r=await fetch(u,{method:m,headers:b?{'Content-Type':'application/json'}:{},body:b?JSON.stringify(b):undefined});
  if(!r.ok){let d={};try{d=await r.json()}catch{}throw new Error(d.detail||'Something went wrong')}return r.json()};
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('show'),2600)}
const LABEL={done:'Ready',waiting_otp:'Needs your code',failed:'Failed',running:'Working…',queued:'Waiting in line',not_run:'Not run yet'};
const pill=s=>`<span class="pill ${s}">${['running','queued'].includes(s)?'<i class=spin></i>':''}${LABEL[s]}</span>`;
let status=null,cfg=null,openRun=null;

/* ---------- routing ---------- */
const page=()=>location.hash.startsWith('#/setup')?'setup':'home';
async function route(){
  $('#t-home').classList.toggle('on',page()=='home');$('#t-setup').classList.toggle('on',page()=='setup');
  if(page()=='home'){await loadHome()}else{await loadSetup()}
}
addEventListener('hashchange',()=>{closeDrawer();route()});

/* ---------- dashboard ---------- */
async function loadHome(){
  status=await api('/api/status');
  $('#sync').textContent=status.shared?'☁ Team sync on':'💻 This computer only';
  const cells=status.cells;
  if(!cells.length){$('#app').innerHTML=`<div class="card empty"><h1>Welcome 👋</h1>
   <p class=sub>Let's get your first report set up. It takes about two minutes.</p>
   <ol class=steps><li><b>Add a brand</b> - the company you pull reports for.</li>
   <li><b>Add a login</b> - the email you use to sign in to the platform (like BigBasket).</li>
   <li><b>Press Run</b> - we open the portal, ask you for the code, and do the rest.</li></ol>
   <a class="btn primary big" href="#/setup">Start setup</a></div>`;return}
  const waiting=cells.filter(c=>c.status=='waiting_otp');
  const busy=cells.some(c=>['running','queued','waiting_otp'].includes(c.status));
  const done=cells.filter(c=>c.status=='done').length;
  const d=new Date().toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'long'});
  const [hh,mm]=status.schedule_time.split(':');const t=new Date(2000,0,1,hh,mm).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});
  const sig=JSON.stringify(waiting.map(w=>w.run_id));
  if(!$('#home')){
    $('#app').innerHTML=`<div id=home><div id=actions></div>
     <div class=card><h2>Which day's report?</h2>
      <div class=row id=chips style="margin:10px 0"></div>
      <div class=row><span>Or pick a day <input type=date id=dDay style="width:165px" onchange="showDay()"></span></div>
      <div id=rangeText style="margin-top:12px;font-weight:600"></div>
      <div class=hint>One report is downloaded per day. The automatic daily run always uses yesterday. Today can't be picked because today's sales aren't complete yet.</div></div>
     <div id=summary></div><div id=brands></div></div>`;window._sig=null;initDates()}
  if(window._sig!==sig){ // only rebuild the code boxes when who's waiting changes, so typing isn't wiped
    window._sig=sig;
    $('#actions').innerHTML=waiting.map(w=>`<div class="card action"><h2>🔑 ${esc(w.platform_label)} · ${esc(w.brand)} needs a code</h2>
     <p style="margin:6px 0 14px">We sent a code to <b>${esc(w.login_id)}</b>. Check that inbox and type the code below.
     <br><span class=hint>A Chrome window has opened - please leave it open.</span></p>
     <div class=row><input class=otp id="otp${w.run_id}" inputmode=numeric autocomplete=one-time-code maxlength=8 placeholder="••••••" onkeydown="if(event.key=='Enter')sendOtp(${w.run_id})">
     <button class="btn primary big" onclick="sendOtp(${w.run_id})">Continue</button></div></div>`).join('');
    const f=$('#actions input');if(f)f.focus()}
  $('#summary').innerHTML=`<div class=card><div class=row><div class=grow><h1>${d}</h1>
    <div class=sub style="margin:0">${done} of ${cells.length} reports ready · runs by itself at ${t} while this app is open</div></div>
    <button class="btn primary big" onclick="runAll()" ${busy?'disabled':''}>${busy?'Working…':'▶ Run all reports'}</button></div>
    <div class=progress><i style="width:${100*done/cells.length}%"></i></div></div>`;
  const byBrand={};cells.forEach(c=>(byBrand[c.brand]??=[]).push(c));
  $('#brands').innerHTML=Object.entries(byBrand).map(([b,list])=>`<div class=card><h2>${esc(b)}</h2>`+list.map(c=>{
    const act=!['running','queued','waiting_otp'].includes(c.status);
    return `<div class=plat><div class=pname>${esc(c.platform_label)}<div class=email>${esc(c.login_id)}</div></div>
     <div class=grow>${pill(c.status)}${c.start_date&&c.status!='not_run'?`<div class=msg>📅 ${c.start_date==c.end_date?c.start_date:c.start_date+' → '+c.end_date}</div>`:''}${c.status=='failed'?`<div class="msg bad">${esc(c.message)}</div>`:c.status=='running'?`<div class=msg>${esc(c.message)}</div>`:''}
      ${c.files.map(f=>`<div class=msg>📄 <a href="/api/runs/${c.run_id}/files/${encodeURIComponent(f)}">${esc(f)}</a></div>`).join('')}</div>
     ${c.status=='done'?`<button class="btn small" onclick="openFolder(${c.run_id})">📂 Open folder</button>`:''}
     ${c.run_id?`<button class="btn small" onclick="showRun(${c.run_id})">Details</button>`:''}
     ${act?`<button class="btn small ${c.status=='failed'?'primary':''}" onclick="runOne(${c.account_id})">${c.status=='failed'?'Try again':c.status=='done'?'Download again':'Run'}</button>`:''}</div>`}).join('')+`</div>`).join('');
  if(openRun)renderRun(openRun);
}
/* ---- day picker ---- */
const fmt=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const pretty=s=>new Date(s+'T12:00:00').toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
const noon=()=>{const t=new Date();t.setHours(12,0,0,0);return t};
function setDay(s){$('#dDay').value=s;showDay()}
function showDay(){const s=$('#dDay').value;window._day=s;
  document.querySelectorAll('#chips .btn').forEach(b=>b.classList.toggle('on',b.dataset.d==s));
  $('#rangeText').innerHTML=s?`📅 ${pretty(s)}`:'Pick a day'}
function initDates(){const y=addDays(noon(),-1);$('#dDay').max=fmt(y);
  $('#chips').innerHTML=[['Yesterday',1],['2 days ago',2],['3 days ago',3]].map(([l,n])=>{const d=fmt(addDays(noon(),-n));
    return `<button class="btn small" data-d="${d}" onclick="setDay('${d}')">${l}</button>`}).join('');
  setDay(window._day||fmt(y))}

function dates(){const d=$('#dDay').value;
  if(!d){toast('Pick a day first');return null}
  if(d>$('#dDay').max){toast("Today and future days can't be selected");return null}
  return {start_date:d,end_date:d}}
async function openFolder(rid){try{await api(`/api/runs/${rid}/open-folder`,'POST')}catch(e){toast(e.message)}}
async function runAll(){const d=dates();if(!d)return;try{await api('/api/run-all','POST',d);toast('Started - this takes a few minutes');loadHome()}catch(e){toast(e.message)}}
async function runOne(id){const d=dates();if(!d)return;try{await api('/api/run/'+id,'POST',d);loadHome()}catch(e){toast(e.message)}}
async function sendOtp(rid){const v=$('#otp'+rid).value.trim();if(!v)return toast('Type the code first');
  try{await api(`/api/runs/${rid}/otp`,'POST',{value:v});toast('Code sent');window._sig=null;loadHome()}catch(e){toast(e.message)}}

/* ---------- details drawer ---------- */
function closeDrawer(){openRun=null;$('#drawer').classList.remove('open')}
function showRun(id){openRun=id;$('#drawer').classList.add('open');renderRun(id)}
async function renderRun(id){
  const d=await api(`/api/runs/${id}/logs`);if(openRun!==id)return;
  $('#drawer').innerHTML=`<div class=row><h2 class=grow>What happened</h2><button class="btn small" onclick="closeDrawer()">Close</button></div>
   <p>${pill(d.run.status)}</p>`+d.logs.filter(l=>!l.line.startsWith('TRACE')).map(l=>`<div class="log ${l.line.startsWith('FAILED')?'bad':''}">${esc(l.line)}<br><small>${esc(l.ts.slice(11))}</small></div>`).join('')+
   `<details style="margin-top:18px"><summary class=hint>Technical details (for support)</summary><pre style="white-space:pre-wrap;font-size:12px">${esc(d.logs.filter(l=>l.line.startsWith('TRACE')).map(l=>l.line).join('\n'))||'none'}</pre></details>`;
}

/* ---------- setup ---------- */
async function loadSetup(){
  cfg=await api('/api/config');
  $('#sync').textContent=cfg.shared_enabled?'☁ Team sync on':'💻 This computer only';
  const P=Object.fromEntries(cfg.platforms.map(p=>[p.id,p.label]));
  const brandRows=cfg.brands.map(b=>`<tr><td><b>${esc(b.name)}</b></td><td>${b.sheet_id?`<a target=_blank href="https://docs.google.com/spreadsheets/d/${esc(b.sheet_id)}">Open sheet ↗</a>`:'<span class=hint>no sheet yet</span>'}</td>
    <td style="text-align:right"><button class="btn small" onclick="editBrand('${encodeURIComponent(b.name)}')">Edit</button> <button class="btn small danger" onclick="delBrand('${encodeURIComponent(b.name)}')">Delete</button></td></tr>`).join('');
  const loginRows=cfg.accounts.map(a=>`<tr><td><b>${esc(a.brand)}</b></td><td>${esc(P[a.platform]||a.platform)}</td><td>${esc(a.login_id)}</td><td>${esc(a.report_hint)}</td>
    <td>${a.has_password?'<span class=chip>password saved</span>':''}</td>
    <td style="text-align:right"><button class="btn small" onclick="editLogin(${a.id})">Edit</button> <button class="btn small danger" onclick="delLogin(${a.id})">Delete</button></td></tr>`).join('');
  $('#app').innerHTML=`<h1>Setup</h1><p class=sub>Add your brands and the platform logins we should use. Changes save instantly.</p>
  <div class=card><div class=row><div class=grow><h2>1 · Brands</h2><div class=hint>The companies you pull reports for.</div></div><button class="btn primary" onclick="editBrand()">+ Add brand</button></div>
   ${cfg.brands.length?`<table style="margin-top:10px">${brandRows}</table>`:''}</div>
  <div class=card><div class=row><div class=grow><h2>2 · Platform logins</h2><div class=hint>The email you use to sign in to each platform's seller portal.</div></div>
   <button class="btn primary" onclick="editLogin()" ${cfg.brands.length?'':'disabled title="Add a brand first"'}>+ Add login</button></div>
   ${cfg.accounts.length?`<table style="margin-top:10px"><tr><th>Brand</th><th>Platform</th><th>Email</th><th>Report</th><th></th><th></th></tr>${loginRows}</table>`:''}</div>
  <div class=card><h2>3 · Schedule</h2><div class=hint>Reports run on their own at this time every day, as long as this app is open.</div>
   <div class=row style="margin-top:12px"><input type=time id=sched value="${esc(cfg.schedule_time)}" style="width:160px"><button class=btn onclick=saveSched()>Save time</button></div>
   <label style="font-weight:500;display:flex;gap:8px;align-items:center;margin-top:16px"><input type=checkbox id=keepOpen onchange=saveSched() style="width:auto" ${cfg.keep_browser_open?'checked':''}> Leave Chrome open after each report downloads (you close it yourself)</label>
   <div class=hint>Turn this off for fully automatic runs - otherwise the next login waits until you close the window.</div></div>
  <div class=card><h2>4 · Share with your team (optional)</h2>
   <div class=hint>Connect one Google Sheet and everyone's computer shows the same brands and logins. Passwords are never shared.</div>
   <label>Shared Google Sheet link</label><input id=ssid value="${esc(cfg.shared_sheet_id)}" placeholder="Paste the link of the team's config sheet">
   <p class=hint>${cfg.shared_enabled?'✅ Connected':cfg.service_account_present?'Paste the sheet link, then Save.':'⚠ Ask your admin for the <b>service_account.json</b> file and put it in this app\'s <b>data</b> folder.'}</p>
   <div class=row><button class=btn onclick=saveShare()>Save</button><button class=btn onclick=syncNow() ${cfg.shared_enabled?'':'disabled'}>↻ Get latest from team</button></div></div>`;
}
function editBrand(enc){const b=enc?cfg.brands.find(x=>x.name==decodeURIComponent(enc)):null;
  $('#dBrandTitle').textContent=b?'Edit brand':'Add brand';$('#bName').value=b?b.name:'';$('#bName').disabled=!!b;
  $('#bSheet').value=b&&b.sheet_id?`https://docs.google.com/spreadsheets/d/${b.sheet_id}`:'';dBrand.showModal()}
async function saveBrand(){const n=$('#bName').value.trim();if(!n)return toast('Brand name is required');
  await api('/api/brands','POST',{name:n,sheet_id:$('#bSheet').value});dBrand.close();toast('Brand saved');loadSetup()}
async function delBrand(enc){const n=decodeURIComponent(enc);if(!confirm(`Delete ${n} and all its logins?`))return;await api('/api/brands/'+enc,'DELETE');loadSetup()}
function platChange(){const p=cfg.platforms.find(x=>x.id==$('#lPlat').value);$('#pwWrap').style.display=p&&p.needs_password?'block':'none';
  $('#rpWrap').style.display=p&&p.has_reports?'block':'none';$('#adsWrap').style.display=p&&p.has_reports?'flex':'none';if(p&&p.has_reports&&!$('#lReport').value&&!$('#lPlat').disabled)$('#lReport').value='gamma'}
function editLogin(id){const a=id?cfg.accounts.find(x=>x.id==id):null;
  $('#dLoginTitle').textContent=a?'Edit login':'Add login';
  $('#lBrand').innerHTML=cfg.brands.map(b=>`<option>${esc(b.name)}</option>`).join('');
  $('#lPlat').innerHTML=cfg.platforms.map(p=>`<option value="${p.id}" ${p.ready?'':'disabled'}>${esc(p.label)}${p.ready?'':' - coming soon'}</option>`).join('');
  if(a){$('#lBrand').value=a.brand;$('#lPlat').value=a.platform}
  $('#lBrand').disabled=$('#lPlat').disabled=!!a;
  $('#lEmail').value=a?a.login_id:'';$('#lNotes').value=a?a.notes:'';$('#lPw').value='';$('#lReport').value=a?a.report_hint:'';$('#lAds').checked=a?!!a.ads_report:true;platChange();dLogin.showModal()}
async function saveLogin(){const e=$('#lEmail').value.trim();if(!e)return toast('Login email is required');
  await api('/api/accounts','POST',{brand:$('#lBrand').value,platform:$('#lPlat').value,login_id:e,notes:$('#lNotes').value,password:$('#lPw').value,report_hint:$('#lReport').value,ads_report:$('#lAds').checked});
  dLogin.close();toast('Login saved');loadSetup()}
async function delLogin(id){if(!confirm('Delete this login?'))return;await api('/api/accounts/'+id,'DELETE');loadSetup()}
async function saveSched(){await api('/api/prefs','POST',{schedule_time:$('#sched').value,shared_sheet_id:cfg.shared_sheet_id,keep_browser_open:$('#keepOpen').checked});toast('Saved')}
async function saveShare(){await api('/api/prefs','POST',{schedule_time:cfg.schedule_time,shared_sheet_id:$('#ssid').value,keep_browser_open:cfg.keep_browser_open});toast('Saved');loadSetup()}
async function syncNow(){try{const d=await api('/api/sync','POST');toast(d.message);loadSetup()}catch(e){toast('Sync failed: '+e.message)}}

route();setInterval(()=>{if(page()=='home')loadHome().catch(()=>{})},2000);
</script>
